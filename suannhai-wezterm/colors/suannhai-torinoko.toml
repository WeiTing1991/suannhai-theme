[metadata]
name = "Suannhai Torinoko"
origin_url = "https://github.com/WeiTing1991/suannhai-theme"

[colors]
foreground = "#3A3226"
background = "#FFF1CF"
cursor_bg = "#3A3226"
cursor_fg = "#FFF1CF"
cursor_border = "#3A3226"
selection_bg = "#D4C4A0"
selection_fg = "#3A3226"
scrollbar_thumb = "#D4C4A0"
split = "#D4C4A0"

ansi = ["#F7E7C4", "#973C3F", "#454D32", "#BF783A", "#165E83", "#745399", "#8F4B38", "#3A3226"]
brights = ["#8A7A5E", "#ab6365", "#6a705b", "#cb9361", "#447e9b", "#8f75ad", "#a56f5f", "#615b51"]

[colors.tab_bar]
background = "#FFF1CF"

[colors.tab_bar.active_tab]
bg_color = "#F7E7C4"
fg_color = "#3A3226"

[colors.tab_bar.inactive_tab]
bg_color = "#FFF1CF"
fg_color = "#8A7A5E"

[colors.tab_bar.inactive_tab_hover]
bg_color = "#D4C4A0"
fg_color = "#3A3226"

