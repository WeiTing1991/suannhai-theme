[colors]
foreground = "#D6CFC4"
background = "#151A21"
cursor_bg = "#D6CFC4"
cursor_fg = "#151A21"
cursor_border = "#D6CFC4"
selection_bg = "#3D4652"
selection_fg = "#D6CFC4"
scrollbar_thumb = "#3D4652"
