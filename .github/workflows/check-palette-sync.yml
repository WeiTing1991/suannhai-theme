name: Check Palette Sync

on:
  pull_request:
    paths:
      - "colors/*.json"
      - "suannhai-nvim/lua/suannhai/palettes/*.lua"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run sync script
        run: python3 scripts/sync-nvim-palettes.py

      - name: Check palettes are in sync
        working-directory: suannhai-nvim
        run: |
          if git diff --quiet lua/suannhai/palettes/; then
            echo "Palettes are in sync"
          else
            echo "::error::Palettes are out of sync. Run 'python3 scripts/sync-nvim-palettes.py' and commit the changes."
            git diff lua/suannhai/palettes/
            exit 1
          fi
